components:
  schemas:
    AccesoEnum:
      enum:
      - SIN_PASSWORD
      - TEMPORAL
      - TEMPORAL_VENCIDA
      - ACTIVA
      type: string
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AccionEnum:
      enum:
      - ANULAR
      - CERRAR
      type: string
      description: |-
        * `ANULAR` - ANULAR
        * `CERRAR` - CERRAR
    ActorEnum:
      enum:
      - CONDUCTOR
      - DESPACHADOR
      - ADMINISTRADOR
      - PASAJERO
      - SISTEMA
      type: string
      description: |-
        * `CONDUCTOR` - Conductor
        * `DESPACHADOR` - Despachador
        * `ADMINISTRADOR` - Administrador
        * `PASAJERO` - Pasajero
        * `SISTEMA` - Sistema
    AlertaVuelo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        viaje:
          type: integer
          readOnly: true
        numero_vuelo:
          type: string
          readOnly: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/TipoAlertaVueloEnum'
          readOnly: true
        detalle:
          type: string
          readOnly: true
        eta:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        creada_en:
          type: string
          format: date-time
          readOnly: true
        atendida_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        atendida_por:
          type: string
          readOnly: true
          nullable: true
      required:
      - atendida_en
      - atendida_por
      - creada_en
      - detalle
      - eta
      - id
      - numero_vuelo
      - tipo
      - viaje
    AsignarRequest:
      type: object
      properties:
        conductor:
          type: integer
          description: Conductor Disponible de la empresa (RN-01, RN-03)
      required:
      - conductor
    AsociarVehiculoRequest:
      type: object
      properties:
        vehiculo:
          type: integer
      required:
      - vehiculo
    BlankEnum:
      enum:
      - ''
    CambiarPasswordRequest:
      type: object
      properties:
        password_actual:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_nueva:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password_actual
      - password_nueva
    CanalEnum:
      enum:
      - WEB
      - WHATSAPP
      - TELEFONO
      - CONVENIO
      - CONTINGENCIA
      type: string
      description: |-
        * `WEB` - Portal web
        * `WHATSAPP` - WhatsApp
        * `TELEFONO` - Teléfono
        * `CONVENIO` - Convenio
        * `CONTINGENCIA` - Contingencia
    CanalPanelEnum:
      enum:
      - TELEFONO
      - WHATSAPP
      - CONVENIO
      type: string
      description: |-
        * `TELEFONO` - TELEFONO
        * `WHATSAPP` - WHATSAPP
        * `CONVENIO` - CONVENIO
    CancelarRequest:
      type: object
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - motivo
    Candidato:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        patente:
          type: string
        distancia_m:
          type: integer
          nullable: true
          description: Desde su última posición al origen
        posicion_en:
          type: string
          format: date-time
          nullable: true
        confiable:
          type: boolean
          description: 'Posición reciente y precisa: si no, no compite ni se sugiere'
        ultimo_viaje_en:
          type: string
          format: date-time
          nullable: true
          description: Fin de su último viaje
        posicion_fila:
          type: integer
          nullable: true
          description: Lugar en la fila del aeropuerto (HU-29)
        sugerido:
          type: boolean
          description: 'El más apto (HU-04). No asigna: lo confirma el despachador'
      required:
      - confiable
      - distancia_m
      - id
      - nombre
      - patente
      - posicion_en
      - posicion_fila
      - sugerido
      - ultimo_viaje_en
    CerrarCajaRequest:
      type: object
      properties:
        monto_rendido:
          type: integer
          maximum: 50000000
          minimum: 0
          description: Efectivo rendido (CLP)
        observacion:
          type: string
          nullable: true
          description: Obligatoria si lo rendido no coincide con lo registrado.
          maxLength: 200
      required:
      - monto_rendido
    CierreCaja:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        monto_registrado:
          type: integer
          maximum: 2147483647
          minimum: 0
        monto_rendido:
          type: integer
          maximum: 50000000
          minimum: 0
        diferencia:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        observacion:
          type: string
          nullable: true
          maxLength: 200
        responsable:
          type: string
        fecha_cierre:
          type: string
          format: date-time
      required:
      - diferencia
      - fecha_cierre
      - id
      - monto_registrado
      - monto_rendido
      - responsable
    CierreForzado:
      type: object
      properties:
        accion:
          type: string
        motivo:
          type: string
        usuario:
          type: string
        creado_en:
          type: string
          format: date-time
      required:
      - accion
      - creado_en
      - motivo
      - usuario
    Columna:
      type: object
      properties:
        clave:
          type: string
        titulo:
          type: string
        tipo:
          $ref: '#/components/schemas/ColumnaTipoEnum'
      required:
      - clave
      - tipo
      - titulo
    ColumnaTipoEnum:
      enum:
      - texto
      - entero
      - pesos
      - fecha
      - fecha_hora
      - porcentaje
      type: string
      description: |-
        * `texto` - texto
        * `entero` - entero
        * `pesos` - pesos
        * `fecha` - fecha
        * `fecha_hora` - fecha_hora
        * `porcentaje` - porcentaje
    Conductor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        activo:
          type: boolean
          readOnly: true
          description: Cuenta habilitada
        rut:
          type: string
          readOnly: true
        telefono:
          type: string
          readOnly: true
        licencia_clase:
          allOf:
          - $ref: '#/components/schemas/LicenciaClaseEnum'
          readOnly: true
        licencia_vence:
          type: string
          format: date
          readOnly: true
        licencia_vigente:
          type: boolean
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoConductorEnum'
          readOnly: true
        vehiculo_activo:
          allOf:
          - $ref: '#/components/schemas/VehiculoDeclarado'
          readOnly: true
          nullable: true
        consentimiento_gps_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acceso:
          allOf:
          - $ref: '#/components/schemas/AccesoEnum'
          description: SIN_PASSWORD (recién creada), TEMPORAL (debe cambiarla), TEMPORAL_VENCIDA
            o ACTIVA.
          readOnly: true
        password_temporal_vence:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        vehiculos:
          type: array
          items:
            $ref: '#/components/schemas/VehiculoAsociado'
          readOnly: true
      required:
      - acceso
      - activo
      - consentimiento_gps_en
      - email
      - estado
      - id
      - licencia_clase
      - licencia_vence
      - licencia_vigente
      - nombre
      - password_temporal_vence
      - rut
      - telefono
      - vehiculo_activo
      - vehiculos
    ConductorContingencia:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required:
      - id
      - nombre
    ConductorCrearRequest:
      type: object
      description: 'Alta: los datos del conductor más el correo de acceso. La cuenta
        queda sin contraseña utilizable.'
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        rut:
          type: string
          minLength: 1
          description: Acepta puntos y la K minúscula.
