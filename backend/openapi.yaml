openapi: 3.0.3
info:
  title: FlotaÁgil API
  version: 0.1.0
  description: 'API de FlotaÁgil: panel web, portal del pasajero y app del conductor.'
paths:
  /api/app/asignaciones/{id}/aceptar/:
    post:
      operationId: app_asignaciones_aceptar_create
      description: 'Dentro de los 60 s: el viaje queda ACEPTADO y el conductor En
        viaje.'
      summary: Aceptar el viaje asignado
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAsignacion'
          description: ''
        '409':
          description: '`asignacion_no_permitida`: ya respondida o pasaron los 60
            s (RN-04).'
  /api/app/asignaciones/{id}/rechazar/:
    post:
      operationId: app_asignaciones_rechazar_create
      description: La reserva vuelve a SOLICITADO para reasignarla (RN-04).
      summary: Rechazar el viaje asignado
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAsignacion'
          description: ''
        '409':
          description: '`asignacion_no_permitida`: ya respondida o pasaron los 60
            s (RN-04).'
  /api/app/consentimiento/:
    post:
      operationId: app_consentimiento_create
      description: Guarda la fecha de aceptación. Si ya estaba aceptado, la conserva.
      summary: Aceptar el tratamiento de la ubicación (RN-18)
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilConductor'
          description: ''
  /api/app/perfil/:
    get:
      operationId: app_perfil_retrieve
      summary: Perfil del conductor de la sesión
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilConductor'
          description: ''
  /api/app/posiciones/:
    post:
      operationId: app_posiciones_create
      description: 'Hasta 100 posiciones por lote. Idempotente: reenviar el mismo
        lote no duplica (única por conductor e instante). Se asocian al viaje en curso
        del conductor, si hay uno.'
      summary: Enviar un lote de posiciones GPS
      tags:
      - app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotePosicionesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LotePosicionesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LotePosicionesRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoLote'
          description: ''
        '409':
          description: '`fuera_de_turno` o `sin_consentimiento` (RN-18).'
  /api/app/turno/:
    post:
      operationId: app_turno_create
      description: 'Disponible exige consentimiento de ubicación, licencia vigente
        y declarar el vehículo del turno: si tiene uno activo se usa ese; si tiene
        más, hay que elegirlo. Un vehículo no puede estar declarado por dos conductores
        en turno. No disponible borra el vehículo declarado. Desde En viaje no se
        cambia aquí.'
      summary: Empezar o terminar el turno (Disponible / No disponible)
      tags:
      - app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TurnoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TurnoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilConductor'
          description: ''
        '409':
          description: '`en_viaje` (RN-03), `sin_consentimiento` (RN-18), `licencia_vencida`,
            `sin_vehiculo`, `elegir_vehiculo` (RN-05), `vehiculo_no_disponible` o
            `vehiculo_ocupado`.'
  /api/app/viaje-activo/:
    get:
      operationId: app_viaje_activo_retrieve
      description: El viaje aceptado y no terminado (ACEPTADO, EN_CAMINO, EN_ZONA
        o PASAJERO_A_BORDO), con las coordenadas para navegar. `viaje` es null si
        no hay uno.
      summary: Viaje en curso del conductor
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaViajeActivo'
          description: ''
  /api/app/viajes/{id}/a-bordo/:
    post:
      operationId: app_viajes_a_bordo_create
      description: Desde EN_ZONA. Desde EN_CAMINO (la geocerca no lo marcó), registra
        antes EN_ZONA con actor CONDUCTOR (DC-17).
      summary: Indicar que el pasajero subió (PASAJERO_A_BORDO)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoViaje'
          description: ''
        '409':
          description: '`estado_no_permitido`: el viaje no está en el estado previo.'
  /api/app/viajes/{id}/en-camino/:
    post:
      operationId: app_viajes_en_camino_create
      summary: Salir hacia el punto de recogida (EN_CAMINO)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - app
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoViaje'
          description: ''
        '409':
          description: '`estado_no_permitido`: el viaje no está en el estado previo.'
  /api/app/viajes/{id}/finalizar/:
    post:
      operationId: app_viajes_finalizar_create
      description: Método y monto obligatorios. El conductor queda Disponible.
      summary: Finalizar el viaje con el pago (RN-10)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinalizarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinalizarRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoViaje'
          description: ''
        '409':
          description: '`estado_no_permitido`: el viaje no está en el estado previo.'
  /api/auth/app/logout/:
    post:
      operationId: auth_app_logout_create
      description: 'Deja el refresh en la lista negra. Responde 204 aunque el refresh
        no sirva (vencido, ya usado o de otro canal): para la app la sesión queda
        cerrada igual.'
      summary: Cerrar sesión en la app del conductor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/app/refresh/:
    post:
      operationId: auth_app_refresh_create
      description: 'Rota el refresh: el anterior queda en la lista negra.'
      summary: Renovar los tokens de la app del conductor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`sesion_invalida`: el refresh no sirve (vencido, usado, de
            otro canal o usuario deshabilitado).'
  /api/auth/app/token/:
    post:
      operationId: auth_app_token_create
      summary: Iniciar sesión en la app del conductor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionApp'
          description: ''
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`credenciales_invalidas`, `cuenta_bloqueada` o `cuenta_deshabilitada`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`rol_no_permitido` (solo conductores).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`throttled`: demasiados intentos desde esta IP (THROTTLE_LOGIN).'
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Deja el refresh de la cookie en la lista negra y borra la cookie.
        Responde 204 aunque no haya sesión. Exige que el navegador envíe Origin (o,
        si falta, Referer) con un origen de PANEL_ORIGENES; el navegador lo pone solo.
      summary: Cerrar sesión del panel
      tags:
      - auth
      responses:
        '204':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Borra `refresh_panel` (Max-Age=0, Path=/api/auth/).
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`origen_no_permitido`: falta el encabezado Origin (y el Referer)
            o no está en PANEL_ORIGENES.'
  /api/auth/password/:
    post:
      operationId: auth_password_create
      description: Exige la contraseña actual. Cierra todas las sesiones del usuario
        (panel y app) y entrega una nueva en el mismo canal del access usado. Quita
        la obligación de cambiar la temporal.
      summary: Cambiar la propia contraseña
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: 'App: tokens nuevos. Panel: solo `access` y el refresh en la
            cookie.'
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          description: Falta el access o no es válido.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`throttled`: demasiados intentos desde esta IP (THROTTLE_LOGIN).'
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rota el refresh (el anterior queda en la lista negra). Los tokens
        nuevos no superan el tope de la sesión. Exige que el navegador envíe Origin
        (o, si falta, Referer) con un origen de PANEL_ORIGENES; el navegador lo pone
        solo.
      summary: Renovar el access del panel con la cookie de refresh
      tags:
      - auth
      responses:
        '200':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`refresh_panel=<refresh>; HttpOnly; SameSite=Lax; Path=/api/auth/;
                Max-Age=<segundos>` (Secure en producción). Max-Age no supera lo que
                le queda a la sesión.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`sesion_invalida` o `sesion_expirada`. No trae Set-Cookie:
            la cookie no se toca. El cliente debe tratar ambos códigos igual (volver
            al login).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`origen_no_permitido`: falta el encabezado Origin (y el Referer)
            o no está en PANEL_ORIGENES.'
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Deja el refresh en la cookie httpOnly «refresh_panel» y emite la
        sesión con su tope absoluto (JWT_SESION_MAX desde este login). Exige que el
        navegador envíe Origin (o, si falta, Referer) con un origen de PANEL_ORIGENES;
        el navegador lo pone solo.
      summary: Iniciar sesión en el panel web
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`refresh_panel=<refresh>; HttpOnly; SameSite=Lax; Path=/api/auth/;
                Max-Age=<segundos>` (Secure en producción). Max-Age no supera lo que
                le queda a la sesión.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionPanel'
          description: ''
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`credenciales_invalidas`, `cuenta_bloqueada` o `cuenta_deshabilitada`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`rol_no_permitido` (el conductor usa la app) u `origen_no_permitido`.'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`unsupported_media_type`: el cuerpo debe ser application/json.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`throttled`: demasiados intentos desde esta IP (THROTTLE_LOGIN).'
  /api/auth/yo/:
    get:
      operationId: auth_yo_retrieve
      summary: Usuario de la sesión actual
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioSesion'
          description: ''
        '401':
          description: Falta el access o no es válido (`token_not_valid`).
  /api/conductores/:
    get:
      operationId: conductores_list
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Listar conductores
      parameters:
      - in: query
        name: activo
        schema:
          type: boolean
        description: Cuenta habilitada
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - DISPONIBLE
          - EN_VIAJE
          - NO_DISPONIBLE
        description: |-
          * `DISPONIBLE` - Disponible
          * `NO_DISPONIBLE` - No disponible
          * `EN_VIAJE` - En viaje
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Nombre, RUT, email o patente asociada
      tags:
      - flota
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConductorList'
          description: ''
    post:
      operationId: conductores_create
      description: 'La cuenta (rol CONDUCTOR) queda sin contraseña utilizable: el
        administrador genera una temporal con `password/`.'
      summary: Registrar un conductor con su cuenta
      tags:
      - flota
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConductorCrearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConductorCrearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConductorCrearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
          description: ''
  /api/conductores/{id}/:
    get:
      operationId: conductores_retrieve
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Detalle de un conductor con sus vehículos
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este conductor.
        required: true
      tags:
      - flota
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
          description: ''
    patch:
      operationId: conductores_partial_update
      description: Nombre, RUT, teléfono y licencia. El email y la contraseña no se
        editan aquí.
      summary: Editar los datos de un conductor
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este conductor.
        required: true
      tags:
      - flota
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConductorEditarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConductorEditarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConductorEditarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
          description: ''
  /api/conductores/{id}/deshabilitar/:
    post:
      operationId: conductores_deshabilitar_create
      description: No puede ingresar, se cierran todas sus sesiones y queda No disponible.
        Auditoría (RN-12).
      summary: Deshabilitar la cuenta del conductor
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este conductor.
        required: true
      tags:
      - flota
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
          description: ''
        '409':
          description: '`conductor_en_viaje`: el conductor está en viaje.'
  /api/conductores/{id}/habilitar/:
    post:
      operationId: conductores_habilitar_create
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Habilitar la cuenta del conductor
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este conductor.
        required: true
      tags:
      - flota
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
          description: ''
  /api/conductores/{id}/password/:
    post:
      operationId: conductores_password_create
      description: Se muestra una sola vez y vence a las PASSWORD_TEMPORAL_HORAS (72
        por defecto). Cierra todas las sesiones del conductor; al ingresar debe cambiarla
        (403 `cambio_password_requerido` en el resto de la API). Queda en auditoría
        (RN-12).
      summary: Generar o restablecer la contraseña temporal
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este conductor.
        required: true
      tags:
      - flota
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordTemporal'
          description: ''
        '409':
          description: '`conductor_en_viaje`: el conductor está en viaje.'
  /api/conductores/{id}/vehiculos/:
    post:
      operationId: conductores_vehiculos_create
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Asociar un vehículo al conductor
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este conductor.
        required: true
      tags:
      - flota
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsociarVehiculoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AsociarVehiculoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsociarVehiculoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conductor'
