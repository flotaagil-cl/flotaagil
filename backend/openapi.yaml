            schema:
              $ref: '#/components/schemas/ForzarCierreRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
  /api/viajes/contingencia/:
    post:
      operationId: viajes_contingencia_create
      description: 'HU-32 (DC-33): un viaje anotado durante una caída, ya FINALIZADO
        (conductor, método y monto) o CANCELADO (motivo), con sus horas reales: pasadas
        y de hasta `contingencia_max_dias` atrás. El historial queda marcado como
        contingencia, sin avisos ni encuesta. Queda en auditoría (`RESERVA_CONTINGENCIA`).'
      summary: Ingresar una reserva de contingencia
      tags:
