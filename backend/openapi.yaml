      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
  /api/viajes/{id}/descartar-recogida/:
    post:
      operationId: viajes_descartar_recogida_create
