      operationId: whatsapp_estado_create
      summary: 'Webhook de Twilio: estado de entrega de un mensaje enviado'
      tags:
      - whatsapp
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '204':
          description: No response body
        '403':
          description: Firma inválida
components:
  schemas:
    AccesoEnum:
      enum:
      - SIN_PASSWORD
      - TEMPORAL
      - TEMPORAL_VENCIDA
      - ACTIVA
      type: string
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActorEnum:
      enum:
      - CONDUCTOR
      - DESPACHADOR
      - ADMINISTRADOR
      - PASAJERO
      - SISTEMA
      type: string
      description: |-
        * `CONDUCTOR` - Conductor
        * `DESPACHADOR` - Despachador
        * `ADMINISTRADOR` - Administrador
        * `PASAJERO` - Pasajero
        * `SISTEMA` - Sistema
    AsignarRequest:
      type: object
      properties:
        conductor:
          type: integer
          description: Conductor Disponible de la empresa (RN-01, RN-03)
      required:
      - conductor
    AsociarVehiculoRequest:
      type: object
      properties:
        vehiculo:
          type: integer
      required:
      - vehiculo
    BlankEnum:
      enum:
      - ''
    CambiarPasswordRequest:
      type: object
      properties:
        password_actual:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_nueva:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password_actual
      - password_nueva
    CanalEnum:
      enum:
      - WEB
      - WHATSAPP
      - TELEFONO
      - CONVENIO
      type: string
      description: |-
        * `WEB` - Portal web
        * `WHATSAPP` - WhatsApp
        * `TELEFONO` - Teléfono
        * `CONVENIO` - Convenio
    CanalPanelEnum:
      enum:
      - TELEFONO
      - WHATSAPP
      - CONVENIO
      type: string
      description: |-
        * `TELEFONO` - TELEFONO
        * `WHATSAPP` - WHATSAPP
        * `CONVENIO` - CONVENIO
    CancelarRequest:
      type: object
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - motivo
    Candidato:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        patente:
          type: string
        distancia_m:
          type: integer
          nullable: true
          description: Desde su última posición al origen
        posicion_en:
          type: string
          format: date-time
          nullable: true
        confiable:
          type: boolean
          description: 'Posición reciente y precisa: si no, no compite ni se sugiere'
        ultimo_viaje_en:
          type: string
          format: date-time
          nullable: true
          description: Fin de su último viaje
        posicion_fila:
          type: integer
          nullable: true
          description: Lugar en la fila del aeropuerto (HU-29)
        sugerido:
          type: boolean
          description: 'El más apto (HU-04). No asigna: lo confirma el despachador'
      required:
      - confiable
      - distancia_m
      - id
      - nombre
      - patente
      - posicion_en
      - posicion_fila
      - sugerido
      - ultimo_viaje_en
    Conductor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        activo:
          type: boolean
          readOnly: true
          description: Cuenta habilitada
        rut:
          type: string
          readOnly: true
        telefono:
          type: string
          readOnly: true
        licencia_clase:
          allOf:
          - $ref: '#/components/schemas/LicenciaClaseEnum'
          readOnly: true
        licencia_vence:
          type: string
          format: date
          readOnly: true
        licencia_vigente:
          type: boolean
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoConductorEnum'
          readOnly: true
        vehiculo_activo:
          allOf:
          - $ref: '#/components/schemas/VehiculoDeclarado'
          readOnly: true
          nullable: true
        consentimiento_gps_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acceso:
          allOf:
          - $ref: '#/components/schemas/AccesoEnum'
          description: SIN_PASSWORD (recién creada), TEMPORAL (debe cambiarla), TEMPORAL_VENCIDA
            o ACTIVA.
          readOnly: true
        password_temporal_vence:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        vehiculos:
          type: array
          items:
            $ref: '#/components/schemas/VehiculoAsociado'
          readOnly: true
      required:
      - acceso
      - activo
      - consentimiento_gps_en
      - email
      - estado
      - id
      - licencia_clase
      - licencia_vence
      - licencia_vigente
      - nombre
      - password_temporal_vence
      - rut
      - telefono
      - vehiculo_activo
      - vehiculos
    ConductorCrearRequest:
      type: object
      description: 'Alta: los datos del conductor más el correo de acceso. La cuenta
        queda sin contraseña utilizable.'
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        rut:
          type: string
          minLength: 1
          description: Acepta puntos y la K minúscula.
          maxLength: 14
        telefono:
          type: string
          minLength: 1
          description: 'Móvil chileno: +569XXXXXXXX (sin prefijo, 9XXXXXXXX también
            sirve).'
          maxLength: 24
        licencia_clase:
          $ref: '#/components/schemas/LicenciaClaseEnum'
        licencia_vence:
          type: string
          format: date
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 120
      required:
      - email
      - licencia_clase
      - licencia_vence
      - nombre
      - rut
      - telefono
    ConductorResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required:
      - id
      - nombre
    ConvenioResumen:
      type: object
      properties:
        id:
          type: integer
        cliente_nombre:
          type: string
      required:
      - cliente_nombre
      - id
    EmpresaPublica:
      type: object
      properties:
        razon_social:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 50
        anticipacion_minima_min:
          type: integer
        expiracion_verificacion_min:
          type: integer
        margen_nacional_min:
          type: integer
          description: Minutos que se suman a la llegada del vuelo cuando no se indica
            la recogida (RN-17).
      required:
      - anticipacion_minima_min
      - expiracion_verificacion_min
      - margen_nacional_min
      - razon_social
      - slug
    EmpresaResumen:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        razon_social:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 50
      required:
      - id
      - razon_social
      - slug
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    EstadoConductorEnum:
      enum:
      - DISPONIBLE
      - NO_DISPONIBLE
      - EN_VIAJE
      type: string
      description: |-
        * `DISPONIBLE` - Disponible
        * `NO_DISPONIBLE` - No disponible
        * `EN_VIAJE` - En viaje
    EstadoViaje:
      type: object
      properties:
        viaje:
          type: integer
        estado:
          type: string
      required:
      - estado
      - viaje
    EstadoViajeEnum:
      enum:
      - PENDIENTE_CONFIRMACION
      - SOLICITADO
      - ASIGNADO
      - ACEPTADO
      - EN_CAMINO
      - EN_ZONA
      - PASAJERO_A_BORDO
      - FINALIZADO
      - CANCELADO
      type: string
      description: |-
        * `PENDIENTE_CONFIRMACION` - Pendiente de confirmación
        * `SOLICITADO` - Solicitado
        * `ASIGNADO` - Asignado
        * `ACEPTADO` - Aceptado
        * `EN_CAMINO` - En camino
        * `EN_ZONA` - En zona
        * `PASAJERO_A_BORDO` - Pasajero a bordo
        * `FINALIZADO` - Finalizado
        * `CANCELADO` - Cancelado
    EstadoVueloEnum:
      enum:
      - PROGRAMADO
      - DEMORADO
      - ATERRIZADO
      - CANCELADO
      - DESVIADO
      type: string
      description: |-
        * `PROGRAMADO` - Programado
        * `DEMORADO` - Demorado
        * `ATERRIZADO` - Aterrizado
        * `CANCELADO` - Cancelado
        * `DESVIADO` - Desviado
    FilaImportacion:
      type: object
      properties:
        linea:
          type: integer
          description: Línea del archivo (la 1 es el encabezado)
        datos:
          type: object
          additionalProperties:
            type: string
        errores:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - datos
      - errores
      - linea
    FinalizarRequest:
      type: object
      properties:
        metodo:
          $ref: '#/components/schemas/MetodoEnum'
        monto:
          type: integer
          maximum: 500000
          minimum: 0
          description: Monto cobrado en CLP
      required:
      - metodo
      - monto
    Historial:
      type: object
      properties:
        estado_anterior:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/EstadoViajeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        estado_nuevo:
          $ref: '#/components/schemas/EstadoViajeEnum'
        actor:
          $ref: '#/components/schemas/ActorEnum'
        usuario:
          type: string
          readOnly: true
        manual:
          type: boolean
        distancia_m:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - creado_en
      - estado_nuevo
      - usuario
    ImportarRequest:
      type: object
      properties:
        archivo:
          type: string
          format: binary
          description: CSV en UTF-8 o Windows-1252, separado por coma o punto y coma.
        confirmar:
          type: boolean
          default: false
          description: 'false: solo valida y muestra el informe. true: crea si no
            hay errores.'
      required:
      - archivo
    InformeImportacion:
      type: object
      properties:
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaImportacion'
        validas:
          type: integer
        con_errores:
          type: integer
        creados:
          type: integer
      required:
      - con_errores
      - creados
      - filas
      - validas
    LicenciaClaseEnum:
      enum:
      - A1
      - A2
      - A3
      type: string
      description: |-
        * `A1` - A1
        * `A2` - A2
        * `A3` - A3
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 120
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    LotePosicionesRequest:
      type: object
      properties:
        posiciones:
          type: array
          items:
            $ref: '#/components/schemas/PosicionRequest'
      required:
      - posiciones
    LugarEnFila:
      type: object
      properties:
        posicion:
          type: integer
          description: 'Su lugar en la fila: 1 es el siguiente (RN-16)'
        total:
          type: integer
        zona:
          type: string
        ingreso_en:
          type: string
          format: date-time
      required:
      - ingreso_en
      - posicion
      - total
      - zona
    MetodoEnum:
      enum:
      - EFECTIVO
      - TARJETA
      - TRANSFERENCIA
      - CONVENIO
      type: string
      description: |-
        * `EFECTIVO` - Efectivo
        * `TARJETA` - Tarjeta
        * `TRANSFERENCIA` - Transferencia
        * `CONVENIO` - Convenio
    NullEnum:
      enum:
      - null
    OrigenCancelacionEnum:
      enum:
      - PASAJERO
      - DESPACHADOR
      - ADMINISTRADOR
      - SUPERVISOR
      - SISTEMA
      type: string
      description: |-
        * `PASAJERO` - Pasajero
        * `DESPACHADOR` - Despachador
        * `ADMINISTRADOR` - Administrador
        * `SUPERVISOR` - Supervisor de convenio
        * `SISTEMA` - Sistema
    PaginatedConductorList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Conductor'
    PaginatedVehiculoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Vehiculo'
    PaginatedViajeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Viaje'
    PasajeroEntradaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        telefono:
          type: string
          minLength: 1
          description: WhatsApp en formato E.164, p. ej. +56912345678.
          maxLength: 24
      required:
      - nombre
      - telefono
    PasajeroResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        telefono:
          type: string
      required:
      - id
      - nombre
      - telefono
    PasswordTemporal:
      type: object
      properties:
        password_temporal:
          type: string
          description: Se muestra una sola vez. No se guarda en texto plano.
        vence_en:
          type: string
          format: date-time
      required:
      - password_temporal
      - vence_en
    PatchedConductorEditarRequest:
      type: object
      description: Datos del conductor. El email y la contraseña (credenciales) no
        se editan aquí.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        rut:
          type: string
          minLength: 1
          description: Acepta puntos y la K minúscula.
          maxLength: 14
        telefono:
          type: string
          minLength: 1
          description: 'Móvil chileno: +569XXXXXXXX (sin prefijo, 9XXXXXXXX también
            sirve).'
          maxLength: 24
        licencia_clase:
          $ref: '#/components/schemas/LicenciaClaseEnum'
        licencia_vence:
          type: string
          format: date
    PatchedVehiculoEditarRequest:
      type: object
      description: 'La patente no se edita: otra patente es otro vehículo.'
      properties:
        marca_modelo:
          type: string
          minLength: 1
          maxLength: 60
        anio:
          type: integer
          maximum: 32767
          minimum: 0
        capacidad:
          type: integer
          maximum: 7
          minimum: 1
        activo:
          type: boolean
    PatchedViajeEditarRequest:
      type: object
      properties:
        sentido:
          $ref: '#/components/schemas/SentidoEnum'
        origen_dir:
          type: string
          minLength: 1
          maxLength: 200
        destino_dir:
          type: string
          minLength: 1
          maxLength: 200
        recogida_en:
          type: string
          format: date-time
        tarifa:
          type: integer
          minimum: 0
          nullable: true
        vuelo:
          allOf:
          - $ref: '#/components/schemas/VueloEntradaRequest'
          nullable: true
    PerfilConductor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoConductorEnum'
          readOnly: true
        vehiculo_activo:
          allOf:
          - $ref: '#/components/schemas/VehiculoDeclarado'
          readOnly: true
          nullable: true
        consentimiento_gps_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        vehiculos:
          type: array
          items:
            $ref: '#/components/schemas/VehiculoAsociado'
          readOnly: true
        fila:
          allOf:
          - $ref: '#/components/schemas/LugarEnFila'
          nullable: true
          readOnly: true
      required:
      - consentimiento_gps_en
      - estado
      - fila
      - id
      - nombre
      - vehiculo_activo
      - vehiculos
    PosicionRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lon:
          type: number
          format: double
          maximum: 180
          minimum: -180
        precision_m:
          type: number
          format: double
          minimum: 0
          nullable: true
        registrada_en:
          type: string
          format: date-time
      required:
      - lat
      - lon
      - registrada_en
    Punto:
      type: object
      properties:
        direccion:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
      required:
      - direccion
      - lat
      - lon
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RespuestaAsignacion:
      type: object
      properties:
        asignacion:
          type: integer
        viaje:
          type: integer
        resultado:
          type: string
        estado_viaje:
          type: string
      required:
      - asignacion
      - estado_viaje
      - resultado
      - viaje
    RespuestaViajeActivo:
      type: object
      properties:
        viaje:
          allOf:
          - $ref: '#/components/schemas/ViajeActivo'
          nullable: true
      required:
      - viaje
    ResultadoLote:
      type: object
      properties:
        recibidas:
          type: integer
          description: Guardadas ahora
        repetidas:
          type: integer
          description: Ya estaban (reenvío del mismo lote)
        descartadas:
          type: integer
          description: 'Precisión > 500 m, del futuro o más antiguas que la retención:
            no se guardan'
      required:
      - descartadas
      - recibidas
      - repetidas
    RolEnum:
      enum:
      - ADMINISTRADOR
      - DESPACHADOR
      - CONDUCTOR
      type: string
      description: |-
        * `ADMINISTRADOR` - Administrador
        * `DESPACHADOR` - Despachador
        * `CONDUCTOR` - Conductor
    SentidoEnum:
      enum:
      - DESDE_AEROPUERTO
      - HACIA_AEROPUERTO
      - URBANO
      type: string
      description: |-
        * `DESDE_AEROPUERTO` - Desde el aeropuerto
        * `HACIA_AEROPUERTO` - Hacia el aeropuerto
        * `URBANO` - Urbano
    SesionApp:
      type: object
      properties:
        access:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioSesion'
        refresh:
          type: string
      required:
      - access
      - refresh
      - usuario
    SesionPanel:
      type: object
      properties:
        access:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioSesion'
      required:
      - access
      - usuario
    SolicitudRequest:
      type: object
      description: 'HU-19: solicitud de viaje sin cuenta.'
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        telefono:
          type: string
          minLength: 1
          description: WhatsApp en formato E.164, p. ej. +56912345678.
          maxLength: 24
        origen_dir:
          type: string
          minLength: 1
          maxLength: 200
        destino_dir:
          type: string
          minLength: 1
          maxLength: 200
        recogida_en:
          type: string
          format: date-time
          nullable: true
          description: 'Obligatoria, salvo en viajes desde el aeropuerto con vuelo:
            ahí se calcula si no viene.'
        sentido:
          allOf:
          - $ref: '#/components/schemas/SentidoEnum'
          description: |-
            Si no viene: DESDE_AEROPUERTO cuando hay vuelo, URBANO si no.

            * `DESDE_AEROPUERTO` - Desde el aeropuerto
            * `HACIA_AEROPUERTO` - Hacia el aeropuerto
            * `URBANO` - Urbano
        vuelo:
          allOf:
          - $ref: '#/components/schemas/VueloLlegadaRequest'
          description: Solo para viajes desde el aeropuerto.
        acepta_privacidad:
          type: boolean
        acepta_whatsapp:
          type: boolean
        sitio_web:
          type: string
          writeOnly: true
      required:
      - acepta_privacidad
      - acepta_whatsapp
      - destino_dir
      - nombre
      - origen_dir
      - telefono
    SolicitudRespuesta:
      type: object
      properties:
        estado:
          type: string
        recogida_en:
          type: string
          format: date-time
        expira_en:
          type: string
          format: date-time
          description: Plazo para confirmar por WhatsApp (RN-06).
        mensaje:
          type: string
      required:
      - estado
      - expira_en
      - mensaje
      - recogida_en
    Tokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TurnoEstadoEnum:
      enum:
      - DISPONIBLE
      - NO_DISPONIBLE
      type: string
      description: |-
        * `DISPONIBLE` - DISPONIBLE
        * `NO_DISPONIBLE` - NO_DISPONIBLE
    TurnoRequest:
