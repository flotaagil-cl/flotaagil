            schema:
              $ref: '#/components/schemas/CancelarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelarRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
  /api/viajes/{id}/candidatos/:
    get:
      operationId: viajes_candidatos_list
      description: 'Disponibles de la empresa con vehículo y sin viaje en ejecución
        (RN-01, RN-03), los más aptos primero: por distancia y, ante diferencias de
        menos de 1 km, por tiempo sin viaje (HU-04). Solo informa: nada se asigna
        sin confirmación (RN-02).'
      summary: Conductores disponibles para asignar
      parameters:
      - in: query
        name: canal
        schema:
          type: string
          enum:
          - CONTINGENCIA
          - CONVENIO
          - TELEFONO
          - WEB
          - WHATSAPP
        description: |-
          * `WEB` - Portal web
          * `WHATSAPP` - WhatsApp
          * `TELEFONO` - Teléfono
          * `CONVENIO` - Convenio
          * `CONTINGENCIA` - Contingencia
      - in: query
        name: desde
        schema:
          type: string
          format: date-time
      - in: query
        name: estado
        schema:
          type: array
          items:
            type: string
            enum:
            - ACEPTADO
            - ASIGNADO
            - CANCELADO
            - EN_CAMINO
            - EN_ZONA
            - FINALIZADO
            - PASAJERO_A_BORDO
            - PENDIENTE_CONFIRMACION
            - SOLICITADO
        description: |-
          Repetible: ?estado=A&estado=B

          * `PENDIENTE_CONFIRMACION` - Pendiente de confirmación
          * `SOLICITADO` - Solicitado
          * `ASIGNADO` - Asignado
          * `ACEPTADO` - Aceptado
          * `EN_CAMINO` - En camino
          * `EN_ZONA` - En zona
          * `PASAJERO_A_BORDO` - Pasajero a bordo
          * `FINALIZADO` - Finalizado
          * `CANCELADO` - Cancelado
        explode: true
        style: form
      - in: query
        name: fecha
        schema:
          type: string
          format: date
        description: Día de recogida
      - in: query
        name: hasta
        schema:
          type: string
          format: date-time
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
      - in: query
        name: ordenar
        schema:
          type: array
          items:
            type: string
            enum:
            - -creado_en
            - -recogida_en
            - creado_en
            - recogida_en
        description: |-
          Ordenamiento

          * `recogida_en` - Recogida en
          * `-recogida_en` - Recogida en (descendente)
          * `creado_en` - Creado en
          * `-creado_en` - Creado en (descendente)
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
        description: Pasajero, teléfono, dirección o número de vuelo
      - in: query
        name: sentido
        schema:
          type: string
          enum:
          - DESDE_AEROPUERTO
          - HACIA_AEROPUERTO
          - URBANO
        description: |-
          * `DESDE_AEROPUERTO` - Desde el aeropuerto
          * `HACIA_AEROPUERTO` - Hacia el aeropuerto
          * `URBANO` - Urbano
      tags:
      - reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidato'
          description: ''
  /api/viajes/{id}/confirmar-recogida/:
    post:
      operationId: viajes_confirmar_recogida_create
      description: 'RN-02: la recogida solo cambia con esta confirmación. Queda en
        auditoría (HU-27).'
