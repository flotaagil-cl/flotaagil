              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
  /api/viajes/{id}/:
    get:
      operationId: viajes_retrieve
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Detalle de una reserva con su historial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
      tags:
      - reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
    patch:
      operationId: viajes_partial_update
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Editar una reserva antes del despacho
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
      tags:
      - reservas
      requestBody:
        content:
