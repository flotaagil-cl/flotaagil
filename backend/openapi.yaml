              $ref: '#/components/schemas/DecidirRecogidaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
  /api/viajes/{id}/forzar-cierre/:
    post:
      operationId: viajes_forzar_cierre_create
      description: 'HU-05: solo con el pasajero a bordo, si el conductor no puede
        hacerlo desde la app. Anular exige motivo; cerrar exige además método y monto
        (RN-10). Queda en auditoría con el responsable (RN-11).'
      summary: Forzar el cierre o la anulación de un viaje en curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
