            schema:
              $ref: '#/components/schemas/PatchedViajeEditarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedViajeEditarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedViajeEditarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
  /api/viajes/{id}/asignar/:
    post:
      operationId: viajes_asignar_create
      description: 'El despachador confirma el conductor (RN-02): la reserva pasa
        de SOLICITADO a ASIGNADO, queda la ASIGNACION y la app del conductor recibe
        el aviso. Tiene 60 s para responder (RN-04, HU-15).'
      summary: Asignar la reserva a un conductor
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
