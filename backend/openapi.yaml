  /api/vehiculos/importar/:
    post:
      operationId: vehiculos_importar_create
      description: |
        Carga inicial de vehículos y de conductores por CSV (HU-10).

        Todo o nada: se valida cada fila con las mismas reglas del alta individual y solo se crea si ninguna tiene
        errores. Sin `confirmar` solo se entrega el informe, para revisarlo antes de cargar.

        Formato común: encabezado en la primera línea; mayúsculas y tildes no importan. Separador coma o punto y coma
        (Excel en español guarda con punto y coma). Codificación UTF-8 (con o sin BOM) o Windows-1252. Hasta 500 filas
        y 1 MB.

        - Vehículos: `patente`, `marca_modelo`, `anio` y, opcional, `capacidad` (por defecto 4). También sirven «año»,
          «marca y modelo» y «marca/modelo».
        - Conductores: `nombre`, `email`, `rut`, `telefono`, `licencia_clase` y `licencia_vence` (AAAA-MM-DD o
          DD-MM-AAAA). Sin contraseñas: las cuentas quedan sin contraseña utilizable y el administrador genera una
          temporal desde la ficha de cada conductor.
      summary: Carga inicial de vehículos por CSV
      tags:
      - flota
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportarRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeImportacion'
          description: Informe sin crear nada.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeImportacion'
          description: Todos creados.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeImportacion'
          description: 'Con `confirmar` y filas con errores: no se crea ninguno. Si
            el archivo no sirve, el error viene en `archivo`.'
  /api/viajes/:
    get:
      operationId: viajes_list
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Listar reservas
      parameters:
      - in: query
        name: canal
        schema:
          type: string
          enum:
          - CONTINGENCIA
          - CONVENIO
          - TELEFONO
          - WEB
          - WHATSAPP
        description: |-
          * `WEB` - Portal web
          * `WHATSAPP` - WhatsApp
          * `TELEFONO` - Teléfono
          * `CONVENIO` - Convenio
          * `CONTINGENCIA` - Contingencia
      - in: query
        name: desde
        schema:
          type: string
          format: date-time
      - in: query
        name: estado
        schema:
          type: array
          items:
            type: string
            enum:
            - ACEPTADO
            - ASIGNADO
            - CANCELADO
            - EN_CAMINO
            - EN_ZONA
            - FINALIZADO
            - PASAJERO_A_BORDO
            - PENDIENTE_CONFIRMACION
            - SOLICITADO
        description: |-
          Repetible: ?estado=A&estado=B

          * `PENDIENTE_CONFIRMACION` - Pendiente de confirmación
          * `SOLICITADO` - Solicitado
          * `ASIGNADO` - Asignado
          * `ACEPTADO` - Aceptado
          * `EN_CAMINO` - En camino
          * `EN_ZONA` - En zona
          * `PASAJERO_A_BORDO` - Pasajero a bordo
          * `FINALIZADO` - Finalizado
          * `CANCELADO` - Cancelado
        explode: true
        style: form
      - in: query
        name: fecha
        schema:
          type: string
          format: date
        description: Día de recogida
      - in: query
        name: hasta
        schema:
          type: string
          format: date-time
      - in: query
        name: ordenar
        schema:
          type: array
          items:
            type: string
            enum:
            - -creado_en
            - -recogida_en
            - creado_en
            - recogida_en
        description: |-
          Ordenamiento

          * `recogida_en` - Recogida en
          * `-recogida_en` - Recogida en (descendente)
          * `creado_en` - Creado en
          * `-creado_en` - Creado en (descendente)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Pasajero, teléfono, dirección o número de vuelo
      - in: query
        name: sentido
        schema:
          type: string
          enum:
          - DESDE_AEROPUERTO
          - HACIA_AEROPUERTO
          - URBANO
        description: |-
          * `DESDE_AEROPUERTO` - Desde el aeropuerto
          * `HACIA_AEROPUERTO` - Hacia el aeropuerto
          * `URBANO` - Urbano
      tags:
      - reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedViajeList'
          description: ''
    post:
      operationId: viajes_create
      description: Queda en SOLICITADO. El vuelo solo se acepta en viajes desde el
        aeropuerto.
      summary: Ingresar una reserva
      tags:
      - reservas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViajeCrearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ViajeCrearRequest'
          multipart/form-data:
