# Entorno de desarrollo local: PostgreSQL 16 + PostGIS 3.4, Redis 7.2 y el backend Django.
# Uso (desde la raíz del repositorio): docker compose -f infra/docker-compose.dev.yml up -d
name: flotaagil

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flotaagil
      POSTGRES_USER: flotaagil
      POSTGRES_PASSWORD: flotaagil-dev
    ports:
      - "5432:5432"
    volumes:
      - db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotaagil -d flotaagil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    image: flotaagil-backend
    env_file: ../backend/.env
    volumes:
      # Código montado: runserver recarga al guardar (StatReloader, por sondeo).
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    # Sano cuando ya migró y responde: el worker y beat esperan esto.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/salud/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Celery: envío de WhatsApp, consulta de vuelos y expiraciones. Misma imagen que el backend: al reconstruirlo,
  # también recibe las dependencias nuevas. No recarga solo al guardar: tras cambiar una tarea, reinícialo.
  worker:
    image: flotaagil-backend
    env_file: ../backend/.env
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Programa las tareas periódicas: RN-06 cada 60 s y RN-04 cada 5 s. Debe haber uno solo.
  beat:
    image: flotaagil-backend
    env_file: ../backend/.env
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule --pidfile=

volumes:
  db-datos:
